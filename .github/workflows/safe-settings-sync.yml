name: Safe Settings Sync

on:
  push:
    branches: [main]
    paths: [".github/repos/**"]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  safeSettingsSync:
    runs-on: ubuntu-latest
    env:
      # Pinned to 2.1.18 (by its commit: a tag can move), not the latest 2.1.21: 2.1.19+ bundle probot@14.2.4, whose Probot constructor
      # initializes `log` asynchronously — full-sync.js calls `probot.log.info(...)` synchronously right after
      # `createProbot()`, hitting a still-null log (TypeError: Cannot read properties of null (reading 'info')).
      # 2.1.18 bundles probot@13.4.4, which sets `log` synchronously in the constructor. Confirmed via probot's
      # own source across both versions; Rulesets support (lib/plugins/rulesets.js) is present in 2.1.18 too, and
      # the 2.1.18→2.1.21 diff is dependency bumps only, no ruleset logic changes.
      SAFE_SETTINGS_COMMIT: 594f3c706de6c4ddafb1a86dfa7468f19337e54f
      SAFE_SETTINGS_CODE_DIR: ${{ github.workspace }}/.safe-settings-code
    steps:
      # Self-checkout: this repo is its own "admin repo", holding its own .github/repos/*.yml config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github-community-projects/safe-settings
          ref: ${{ env.SAFE_SETTINGS_COMMIT }}
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false

      - run: npm ci --ignore-scripts
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}

      - run: npm run full-sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          GH_ORG: ${{ vars.SAFE_SETTINGS_GH_ORG }}
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          ADMIN_REPO: git-commit-sentinel-bitbucket
