name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, format check (Spotless), tests, coverage (JaCoCo, 100%), mutation testing (PIT, 100%) and SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.pitest:pitest-maven:mutationCoverage
          ${SONAR_TOKEN:+org.sonarsource.scanner.maven:sonar-maven-plugin:sonar}

      - name: Upload coverage and mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            */target/site/jacoco/
            */target/pit-reports/
          if-no-files-found: ignore

      - name: Upload plugin jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-jar
          path: bitbucket-dc-9/target/git-commit-sentinel-bitbucket-dc-9-*.jar
          if-no-files-found: error

  e2e:
    # A real Bitbucket per version, in a pod (e2e/run.sh): the production version and the latest 9.4 patch.
    runs-on: ubuntu-24.04 # pinned: it ships Podman, and ubuntu-latest moves to 26.04 in November 2026
    strategy:
      fail-fast: false
      matrix:
        bitbucket: ["9.4.13", "9.4.26"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the plugin
        run: mvn -B package -DskipTests

      - name: End-to-end tests on Bitbucket ${{ matrix.bitbucket }}
        run: e2e/run.sh
        env:
          BITBUCKET_VERSION: ${{ matrix.bitbucket }}
