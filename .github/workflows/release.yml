name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set the project version
        run: >
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.22.0:set
          -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build, format check, tests, coverage and mutation testing
        run: mvn -B verify org.pitest:pitest-maven:mutationCoverage

      - name: Checksum
        working-directory: bitbucket-dc-9/target
        run: sha256sum "git-commit-sentinel-bitbucket-dc-9-${{ steps.version.outputs.version }}.jar" > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "bitbucket-dc-9/target/git-commit-sentinel-bitbucket-dc-9-${{ steps.version.outputs.version }}.jar" \
            bitbucket-dc-9/target/SHA256SUMS.txt
